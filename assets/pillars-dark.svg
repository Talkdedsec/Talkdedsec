<rect x="0" y="0" width="1280" height="1" fill="#1E1E1E"/>
<rect x="0" y="255" width="1280" height="1" fill="#1E1E1E"/>
<text x="40" y="64" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" letter-spacing="2.4" fill="#FF3B52">01</text><text x="40" y="108" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="25" font-weight="400" letter-spacing="-.4" fill="#F4F4F4">Desktop</text><text x="40" y="146" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#8C8C8C">Windows apps and local utilities.</text><text x="40" y="171" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#8C8C8C">Installers, updates, no telemetry.</text><text x="40" y="196" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#8C8C8C">Rust · C# · Tauri · WPF</text><rect x="320.0" y="28" width="1" height="200" fill="#1E1E1E"/><text x="360" y="64" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" letter-spacing="2.4" fill="#FF3B52">02</text><text x="360" y="108" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="25" font-weight="400" letter-spacing="-.4" fill="#F4F4F4">Web</text><text x="360" y="146" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#8C8C8C">Product sites and storefronts.</text><text x="360" y="171" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#8C8C8C">Bilingual, server-rendered.</text><text x="360" y="196" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#8C8C8C">Next.js · Prisma · PostgreSQL</text><rect x="640.0" y="28" width="1" height="200" fill="#1E1E1E"/><text x="680" y="64" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" letter-spacing="2.4" fill="#FF3B52">03</text><text x="680" y="108" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="25" font-weight="400" letter-spacing="-.4" fill="#F4F4F4">Systems</text><text x="680" y="146" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#8C8C8C">Licensing, releases, deploys.</text><text x="680" y="171" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#8C8C8C">Runs on my own servers.</text><text x="680" y="196" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#8C8C8C">Node · Linux · nginx · PM2</text><rect x="960.0" y="28" width="1" height="200" fill="#1E1E1E"/><text x="1000" y="64" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" letter-spacing="2.4" fill="#FF3B52">04</text><text x="1000" y="108" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="25" font-weight="400" letter-spacing="-.4" fill="#F4F4F4">Interactive</text><text x="1000" y="146" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#8C8C8C">Browser games and design systems.</text><text x="1000" y="171" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#8C8C8C">Client-side, nothing sent out.</text><text x="1000" y="196" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#8C8C8C">TypeScript · Canvas · WebGL</text>
</svg>
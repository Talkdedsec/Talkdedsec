<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Talkdedsec</title>
  <desc id="desc">Animated red and black developer profile banner</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080808"/>
      <stop offset="0.5" stop-color="#111"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5f000b" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#ff1738"/>
      <stop offset="0.5" stop-color="#ff6a7f"/>
      <stop offset="0.75" stop-color="#ff1738"/>
      <stop offset="1" stop-color="#5f000b" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="iris" cx="48%" cy="44%" r="60%">
      <stop offset="0" stop-color="#ff6579"/>
      <stop offset="0.28" stop-color="#f31b38"/>
      <stop offset="0.65" stop-color="#8f0017"/>
      <stop offset="1" stop-color="#210005"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".035"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 0H1200" stroke="#fff" stroke-opacity=".024"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textGlow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="eyeClip">
      <path d="M822 210c48-73 111-105 183-105s135 32 183 105c-48 73-111 105-183 105S870 283 822 210Z"/>
    </clipPath>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="28" fill="url(#grid)"/>
  <rect width="1200" height="420" rx="28" fill="url(#scan)"/>

  <rect x="62" y="64" width="3" height="292" rx="2" fill="#ff1738">
    <animate attributeName="opacity" values=".35;1;.35" dur="2.8s" repeatCount="indefinite"/>
  </rect>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="104" y="120" fill="#ff2748" font-size="15" font-weight="700" letter-spacing="6">INDEPENDENT DEVELOPER</text>
    <text x="99" y="224" fill="#f5f5f5" font-size="86" font-weight="800" letter-spacing="-4" filter="url(#textGlow)">TALKDEDSEC</text>
    <text x="104" y="275" fill="#a8a8a8" font-size="22">software · tools · systems · digital products</text>
    <text x="104" y="324" fill="#666" font-size="14" letter-spacing="2.2">BUILDING THINGS THAT HOLD UP OUTSIDE THE DEMO</text>
  </g>

  <g>
    <ellipse cx="1005" cy="210" rx="150" ry="112" fill="#ff1738" opacity=".08" filter="url(#glow)">
      <animate attributeName="opacity" values=".04;.16;.04" dur="4.2s" repeatCount="indefinite"/>
    </ellipse>
    <path d="M822 210c48-73 111-105 183-105s135 32 183 105c-48 73-111 105-183 105S870 283 822 210Z" fill="#080808" stroke="#202020" stroke-width="7"/>
    <g clip-path="url(#eyeClip)">
      <circle cx="1005" cy="210" r="73" fill="#160005" stroke="#51000d" stroke-width="7"/>
      <circle cx="1005" cy="210" r="59" fill="url(#iris)" filter="url(#glow)">
        <animate attributeName="r" values="56;62;56" dur="3.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1005" cy="210" r="34" fill="#160005"/>
      <circle cx="1005" cy="210" r="17" fill="#020202"/>
      <circle cx="985" cy="188" r="8" fill="#fff" opacity=".4"/>
      <circle cx="1005" cy="210" r="47" fill="none" stroke="#ff536a" stroke-opacity=".35" stroke-width="2" stroke-dasharray="5 8">
        <animateTransform attributeName="transform" type="rotate" from="0 1005 210" to="360 1005 210" dur="15s" repeatCount="indefinite"/>
      </circle>
      <rect x="805" y="204" width="400" height="8" fill="url(#red)" filter="url(#glow)">
        <animate attributeName="y" values="154;266;154" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".12;.9;.12" dur="4s" repeatCount="indefinite"/>
      </rect>
    </g>
    <rect x="780" y="174" width="455" height="4" fill="url(#red)" transform="rotate(-7 1005 176)" opacity=".7">
      <animate attributeName="opacity" values=".15;.85;.15" dur="2.7s" repeatCount="indefinite"/>
    </rect>
    <rect x="780" y="244" width="455" height="3" fill="url(#red)" transform="rotate(5 1005 246)" opacity=".65">
      <animate attributeName="opacity" values=".75;.1;.75" dur="3.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="0" y="398" width="1200" height="2" fill="#1d1d1d"/>
  <rect x="-260" y="398" width="260" height="2" fill="url(#red)">
    <animate attributeName="x" values="-260;1200" dur="5s" repeatCount="indefinite"/>
  </rect>
</svg>

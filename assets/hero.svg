<svg width="1280" height="430" viewBox="0 0 1280 430" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="430">
    <stop stop-color="#020202"/>
    <stop offset=".5" stop-color="#080808"/>
    <stop offset="1" stop-color="#010101"/>
  </linearGradient>
  <linearGradient id="accent" x1="170" y1="0" x2="1110" y2="0">
    <stop stop-color="#741010" stop-opacity="0"/>
    <stop offset=".22" stop-color="#B92D2D"/>
    <stop offset=".5" stop-color="#F2F2F2"/>
    <stop offset=".78" stop-color="#B92D2D"/>
    <stop offset="1" stop-color="#741010" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(640 210) rotate(90) scale(230 590)">
    <stop stop-color="#9E1717" stop-opacity=".16"/>
    <stop offset="1" stop-color="#9E1717" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" stroke="#141414" stroke-width="1"/>
  </pattern>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="6"/>
  </filter>
</defs>

<rect width="1280" height="430" rx="30" fill="url(#bg)"/>
<rect width="1280" height="430" rx="30" fill="url(#grid)" opacity=".52"/>
<ellipse cx="640" cy="210" rx="570" ry="215" fill="url(#glow)"/>
<rect x="42" y="42" width="1196" height="346" rx="23" stroke="#1A1A1A"/>

<g opacity=".96">
  <text x="640" y="158" text-anchor="middle" fill="#F4F4F4"
        font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="700"
        letter-spacing="-2">TALKDEDSEC</text>
  <text x="640" y="210" text-anchor="middle" fill="#A8A8A8"
        font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600"
        letter-spacing="2.4">SOFTWARE  /  PRODUCTS  /  SYSTEMS</text>
  <text x="640" y="276" text-anchor="middle" fill="#E7E7E7"
        font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700">
        Primary GitHub account
  </text>
  <text x="640" y="312" text-anchor="middle" fill="#8D8D8D"
        font-family="Arial, Helvetica, sans-serif" font-size="18">
        Desktop applications, developer tools, web products, security utilities and games.
  </text>
</g>

<g filter="url(#soft)">
  <rect x="170" y="347" width="940" height="2.4" rx="1.2" fill="url(#accent)">
    <animate attributeName="opacity" values=".3;1;.3" dur="5.2s" repeatCount="indefinite"/>
  </rect>
</g>
<rect x="220" y="347" width="840" height="1" rx=".5" fill="url(#accent)"/>

<circle cx="82" cy="82" r="3" fill="#D83838">
  <animate attributeName="opacity" values=".25;1;.25" dur="2.8s" repeatCount="indefinite"/>
</circle>
<circle cx="1198" cy="348" r="3" fill="#EDEDED">
  <animate attributeName="opacity" values="1;.28;1" dur="3.3s" repeatCount="indefinite"/>
</circle>
</svg>

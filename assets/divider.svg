<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="36" viewBox="0 0 1200 36" role="img" aria-label="Animated divider">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#202020"/>
      <stop offset=".45" stop-color="#ff1738"/>
      <stop offset=".55" stop-color="#ff6a7f"/>
      <stop offset="1" stop-color="#202020"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-200%" width="140%" height="500%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="0" y="17" width="1200" height="1" fill="#242424"/>
  <rect x="-260" y="16" width="260" height="3" rx="2" fill="url(#line)" filter="url(#glow)">
    <animate attributeName="x" values="-260;1200" dur="4.8s" repeatCount="indefinite"/>
  </rect>
  <circle cx="600" cy="17.5" r="4" fill="#ff1738">
    <animate attributeName="r" values="3;5;3" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".45;1;.45" dur="2.4s" repeatCount="indefinite"/>
  </circle>
</svg>

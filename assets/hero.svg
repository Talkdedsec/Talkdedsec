<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Talkdedsec</title>
  <desc id="desc">Animated red and black developer profile banner</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080808"/>
      <stop offset="0.48" stop-color="#111"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6b000b"/>
      <stop offset="0.48" stop-color="#ff1738"/>
      <stop offset="0.52" stop-color="#ff6177"/>
      <stop offset="1" stop-color="#6b000b"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff2748" stop-opacity=".72"/>
      <stop offset=".45" stop-color="#b90021" stop-opacity=".22"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#fff" stroke-opacity=".035" stroke-width="1"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 0H1200" stroke="#fff" stroke-opacity=".025"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textGlow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="eyeClip">
      <path d="M866 204c54-70 137-70 191 0-54 70-137 70-191 0Z"/>
    </clipPath>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="28" fill="url(#grid)"/>
  <rect width="1200" height="420" rx="28" fill="url(#scan)" opacity=".8"/>

  <g opacity=".7">
    <circle cx="1040" cy="80" r="180" fill="none" stroke="#ff1738" stroke-opacity=".08" stroke-width="1">
      <animate attributeName="r" values="150;205;150" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values=".03;.12;.03" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1000" cy="350" r="115" fill="none" stroke="#ff1738" stroke-opacity=".08" stroke-width="1">
      <animate attributeName="r" values="95;145;95" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <rect x="62" y="64" width="3" height="292" rx="2" fill="url(#red)">
    <animate attributeName="opacity" values=".4;1;.4" dur="2.8s" repeatCount="indefinite"/>
  </rect>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="104" y="120" fill="#ff2748" font-size="15" font-weight="700" letter-spacing="6">INDEPENDENT DEVELOPER</text>
    <text x="99" y="224" fill="#f5f5f5" font-size="86" font-weight="800" letter-spacing="-4" filter="url(#textGlow)">TALKDEDSEC</text>
    <text x="104" y="275" fill="#a8a8a8" font-size="22" font-weight="400" letter-spacing=".3">software · tools · systems · digital products</text>
    <text x="104" y="324" fill="#666" font-size="14" letter-spacing="2.2">BUILDING THINGS THAT HOLD UP OUTSIDE THE DEMO</text>
  </g>

  <g transform="translate(0,2)">
    <ellipse cx="962" cy="202" rx="130" ry="98" fill="url(#eyeGlow)" opacity=".35">
      <animate attributeName="opacity" values=".18;.5;.18" dur="4.4s" repeatCount="indefinite"/>
    </ellipse>
    <path d="M866 204c54-70 137-70 191 0-54 70-137 70-191 0Z" fill="none" stroke="#efefef" stroke-opacity=".72" stroke-width="2.4"/>
    <g clip-path="url(#eyeClip)">
      <circle cx="962" cy="204" r="43" fill="#0d0d0d" stroke="#ff2748" stroke-width="4" filter="url(#softGlow)">
        <animate attributeName="r" values="40;44;40" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="962" cy="204" r="15" fill="#ff2748">
        <animate attributeName="fill" values="#ff1738;#ff6a7f;#ff1738" dur="2.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="953" cy="195" r="5" fill="#fff" opacity=".85"/>
      <rect x="832" y="203" width="260" height="2" fill="#ff1738" opacity=".4">
        <animate attributeName="y" values="145;265;145" dur="3.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;.75;0" dur="3.8s" repeatCount="indefinite"/>
      </rect>
    </g>
    <path d="M866 204c54-70 137-70 191 0" fill="none" stroke="#ff2748" stroke-opacity=".35" stroke-width="8" filter="url(#softGlow)"/>
  </g>

  <g fill="#ff2748">
    <circle cx="1122" cy="96" r="3"><animate attributeName="opacity" values="0;1;0" dur="2.3s" repeatCount="indefinite"/></circle>
    <circle cx="1084" cy="320" r="2"><animate attributeName="opacity" values="1;0;1" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="792" cy="112" r="2"><animate attributeName="opacity" values="0;1;0" dur="2.7s" repeatCount="indefinite"/></circle>
  </g>

  <rect x="0" y="398" width="1200" height="2" fill="#1d1d1d"/>
  <rect x="0" y="398" width="240" height="2" fill="url(#red)">
    <animate attributeName="x" values="-260;1200" dur="5s" repeatCount="indefinite"/>
  </rect>
</svg>

name: denetim

on:
  schedule:
    - cron: "23 5 1 * *" # her ayın biri
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: denetim
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: node scripts/audit.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

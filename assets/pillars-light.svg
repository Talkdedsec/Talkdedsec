<text x="40" y="64" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" letter-spacing="2.4" fill="#D62839">01</text><text x="40" y="108" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="25" font-weight="400" letter-spacing="-.4" fill="#0A0A0A">Desktop</text><text x="40" y="146" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#6E6E6E">Windows apps and local utilities.</text><text x="40" y="171" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#6E6E6E">Installers, updates, no telemetry.</text><text x="40" y="196" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#6E6E6E">Rust · C# · Tauri · WPF</text><rect x="320.0" y="28" width="1" height="200" fill="#E6E6E6"/><text x="360" y="64" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" letter-spacing="2.4" fill="#D62839">02</text><text x="360" y="108" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="25" font-weight="400" letter-spacing="-.4" fill="#0A0A0A">Web</text><text x="360" y="146" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#6E6E6E">Product sites and storefronts.</text><text x="360" y="171" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#6E6E6E">Bilingual, server-rendered.</text><text x="360" y="196" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#6E6E6E">Next.js · Prisma · PostgreSQL</text><rect x="640.0" y="28" width="1" height="200" fill="#E6E6E6"/><text x="680" y="64" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" letter-spacing="2.4" fill="#D62839">03</text><text x="680" y="108" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="25" font-weight="400" letter-spacing="-.4" fill="#0A0A0A">Systems</text><text x="680" y="146" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#6E6E6E">Licensing, releases, deploys.</text><text x="680" y="171" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#6E6E6E">Runs on my own servers.</text><text x="680" y="196" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#6E6E6E">Node · Linux · nginx · PM2</text><rect x="960.0" y="28" width="1" height="200" fill="#E6E6E6"/><text x="1000" y="64" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" letter-spacing="2.4" fill="#D62839">04</text><text x="1000" y="108" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="25" font-weight="400" letter-spacing="-.4" fill="#0A0A0A">Interactive</text><text x="1000" y="146" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#6E6E6E">Browser games and design systems.</text><text x="1000" y="171" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#6E6E6E">Client-side, nothing sent out.</text><text x="1000" y="196" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#6E6E6E">TypeScript · Canvas · WebGL</text>
</svg>
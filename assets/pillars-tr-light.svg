ar,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" letter-spacing="2.4" fill="#D62839">03</text><text x="680" y="108" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="25" font-weight="400" letter-spacing="-.4" fill="#0A0A0A">Sistem</text><text x="680" y="146" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#6E6E6E">Lisans, sürüm, dağıtım.</text><text x="680" y="171" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#6E6E6E">Kendi sunucularımda çalışır.</text><text x="680" y="196" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#6E6E6E">Node · Linux · nginx · PM2</text><rect x="960.0" y="28" width="1" height="200" fill="#E6E6E6"/><text x="1000" y="64" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" letter-spacing="2.4" fill="#D62839">04</text><text x="1000" y="108" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="25" font-weight="400" letter-spacing="-.4" fill="#0A0A0A">Etkileşim</text><text x="1000" y="146" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#6E6E6E">Tarayıcı oyunları, tasarım sistemleri.</text><text x="1000" y="171" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#6E6E6E">İstemci tarafı, veri dışarı gitmez.</text><text x="1000" y="196" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#6E6E6E">TypeScript · Canvas · WebGL</text>

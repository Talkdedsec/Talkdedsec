<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640" role="img" aria-labelledby="title desc">
  <title id="title">Talkdedsec eye</title>
  <desc id="desc">Animated red scanline eye mark</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#717171"/>
      <stop offset=".62" stop-color="#515151"/>
      <stop offset="1" stop-color="#333"/>
    </radialGradient>
    <radialGradient id="iris" cx="48%" cy="45%" r="56%">
      <stop offset="0" stop-color="#ff5268"/>
      <stop offset=".26" stop-color="#ef1835"/>
      <stop offset=".62" stop-color="#9b0019"/>
      <stop offset="1" stop-color="#290006"/>
    </radialGradient>
    <linearGradient id="slash" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2748" stop-opacity="0"/>
      <stop offset=".22" stop-color="#ff2748" stop-opacity=".82"/>
      <stop offset=".5" stop-color="#ff7588"/>
      <stop offset=".78" stop-color="#ff2748" stop-opacity=".82"/>
      <stop offset="1" stop-color="#ff2748" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur18" x="-30%" y="-80%" width="160%" height="260%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="blur8" x="-30%" y="-80%" width="160%" height="260%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="11" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="eye">
      <path d="M77 320C141 224 224 182 320 182s179 42 243 138c-64 96-147 138-243 138S141 416 77 320Z"/>
    </clipPath>
    <pattern id="grain" width="9" height="9" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="2" r=".7" fill="#fff" opacity=".05"/>
      <circle cx="7" cy="6" r=".55" fill="#000" opacity=".08"/>
    </pattern>
  </defs>

  <rect width="640" height="640" rx="68" fill="url(#bg)"/>
  <rect width="640" height="640" rx="68" fill="url(#grain)"/>

  <g opacity=".72" filter="url(#blur18)">
    <rect x="-60" y="287" width="760" height="18" fill="url(#slash)" transform="rotate(-8 320 296)"/>
    <rect x="-80" y="338" width="800" height="16" fill="url(#slash)" transform="rotate(6 320 346)"/>
  </g>

  <path d="M77 320C141 224 224 182 320 182s179 42 243 138c-64 96-147 138-243 138S141 416 77 320Z" fill="#090909" stroke="#1b1b1b" stroke-width="10"/>

  <g clip-path="url(#eye)">
    <circle cx="320" cy="320" r="116" fill="#170006" stroke="#54000e" stroke-width="8"/>
    <circle cx="320" cy="320" r="95" fill="url(#iris)" filter="url(#glow)">
      <animate attributeName="r" values="91;98;91" dur="3.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="320" cy="320" r="55" fill="#190006"/>
    <circle cx="320" cy="320" r="28" fill="#020202"/>
    <circle cx="286" cy="278" r="13" fill="#fff" opacity=".42"/>

    <g opacity=".42">
      <path d="M320 218V422M218 320H422M248 248l144 144M392 248 248 392" stroke="#ff5168" stroke-width="3"/>
      <circle cx="320" cy="320" r="76" fill="none" stroke="#ff5c73" stroke-width="2" stroke-dasharray="6 10">
        <animateTransform attributeName="transform" type="rotate" from="0 320 320" to="360 320 320" dur="18s" repeatCount="indefinite"/>
      </circle>
    </g>

    <rect x="45" y="310" width="550" height="10" fill="url(#slash)" filter="url(#blur8)">
      <animate attributeName="y" values="248;382;248" dur="4.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".15;.9;.15" dur="4.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <path d="M77 320C141 224 224 182 320 182s179 42 243 138" fill="none" stroke="#d4d4d4" stroke-opacity=".18" stroke-width="5"/>

  <g opacity=".8">
    <rect x="-35" y="286" width="710" height="4" fill="url(#slash)" transform="rotate(-8 320 288)">
      <animate attributeName="opacity" values=".15;.95;.15" dur="2.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="-40" y="353" width="720" height="3" fill="url(#slash)" transform="rotate(6 320 354)">
      <animate attributeName="opacity" values=".85;.12;.85" dur="3.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="0" y="0" width="640" height="640" rx="68" fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="3"/>
</svg>
